name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: kirana_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # Throwaway CI database; this password is not a secret.
            TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kirana_test?schema=public
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - run: npm install # no lockfile, by owner decision (DECISIONS P-006)
            - run: npx prisma generate
            - run: npx tsc --noEmit
            - run: npx tsc --noEmit -p tsconfig.test.json
            - run: npm run lint
            - run: npm test
